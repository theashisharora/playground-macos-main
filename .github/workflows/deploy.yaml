# CI only. The site is hosted on Vercel (which builds and deploys from the
# connected GitHub repository), so this workflow NO LONGER publishes to GitHub
# Pages. It only checks that the frontend builds and the Worker tests pass.
name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22.6+ is required by the Worker tests (--experimental-strip-types).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        # No VITE_* values here: CI builds the browser-only preview mode.
        run: pnpm build

      - name: Worker tests
        run: npm --prefix server/contact-worker test
